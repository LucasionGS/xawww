[package]
name = "awww-daemon"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
common = { workspace = true }

waybackend = { version = "0.8" }
log = { version = "0.4", default-features = false, features = [ "max_level_trace",
  "release_max_level_info",
] }
rustix = { version = "1.1", default-features = false, features = [ "event", "runtime", "stdio", "termios" ] }
libc = "0.2"
keyframe = "1.1"
sd-notify = { version = "0.4" }
smallvec  = { version = "1.15", default-features = false, features = [ "union" ] }

[build-dependencies]
waybackend-scanner = { version = "0.8", features = ["build-script"] }
