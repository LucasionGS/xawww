when:
  - event: pull_request
    branch: main
    path: 'Cargo.lock'
  - event: push
    branch: main
    path: 'Cargo.lock'

steps:
  cargo-deny:
    image: alpine
    environment:
      CARGO_TERM_COLOR: always
      NAME: cargo-deny
      VS: 0.18.5
      DIR: cargo-deny
    commands:
      - apk add --no-cache curl tar
      - curl -L -o $DIR/archive.tar.gz https://github.com/EmbarkStudios/$NAME/releases/download/$VS/$NAME-$VS-x86_64-unknown-linux-musl.tar.gz
      - tar -xzvf $DIR/archive.tar.gz --strip-components=1 -C $DIR
      - ./$DIR/$NAME -L debug check bans licenses advisories sources
